<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340">
  <!-- Background -->
  <rect width="540" height="340" fill="white"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="black">BST — addNode(5, 2, 8, 1, 3, 6, 10)</text>
  <text x="270" y="44" text-anchor="middle" font-family="monospace" font-size="11" fill="black">Perfect binary tree — all leaves at the same level</text>

  <!-- Edges L1 -->
  <!-- 5 -> 2 -->
  <line x1="270" y1="78" x2="148" y2="162" stroke="black" stroke-width="2"/>
  <text x="193" y="112" font-family="monospace" font-size="11" fill="black">L</text>
  <!-- 5 -> 8 -->
  <line x1="270" y1="78" x2="392" y2="162" stroke="black" stroke-width="2"/>
  <text x="338" y="112" font-family="monospace" font-size="11" fill="black">R</text>

  <!-- Edges L2 -->
  <!-- 2 -> 1 -->
  <line x1="148" y1="198" x2="78" y2="262" stroke="black" stroke-width="2"/>
  <text x="97" y="224" font-family="monospace" font-size="11" fill="black">L</text>
  <!-- 2 -> 3 -->
  <line x1="148" y1="198" x2="218" y2="262" stroke="black" stroke-width="2"/>
  <text x="190" y="224" font-family="monospace" font-size="11" fill="black">R</text>
  <!-- 8 -> 6 -->
  <line x1="392" y1="198" x2="322" y2="262" stroke="black" stroke-width="2"/>
  <text x="342" y="224" font-family="monospace" font-size="11" fill="black">L</text>
  <!-- 8 -> 10 -->
  <line x1="392" y1="198" x2="462" y2="262" stroke="black" stroke-width="2"/>
  <text x="433" y="224" font-family="monospace" font-size="11" fill="black">R</text>

  <!-- Null stubs for leaves -->
  <!-- Node 1 -->
  <line x1="62"  y1="281" x2="38"  y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="20"  y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="38"  y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>
  <line x1="94"  y1="281" x2="116" y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="98"  y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="116" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>
  <!-- Node 3 -->
  <line x1="202" y1="281" x2="178" y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="160" y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="178" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>
  <line x1="234" y1="281" x2="256" y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="238" y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="256" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>
  <!-- Node 6 -->
  <line x1="306" y1="281" x2="282" y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="264" y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="282" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>
  <line x1="338" y1="281" x2="360" y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="342" y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="360" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>
  <!-- Node 10 -->
  <line x1="446" y1="281" x2="422" y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="404" y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="422" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>
  <line x1="478" y1="281" x2="500" y2="312" stroke="black" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="482" y="312" width="36" height="16" fill="white" stroke="black" stroke-width="1.5" rx="3"/>
  <text x="500" y="324" text-anchor="middle" font-family="monospace" font-size="9" fill="black">null</text>

  <!-- Nodes (drawn last) -->
  <!-- Root: 5 -->
  <circle cx="270" cy="68" r="24" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="270" y="75" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="black">5</text>

  <!-- Level 1 -->
  <circle cx="148" cy="180" r="24" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="148" y="187" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="black">2</text>

  <circle cx="392" cy="180" r="24" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="392" y="187" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="black">8</text>

  <!-- Level 2 -->
  <circle cx="78"  cy="272" r="24" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="78"  y="279" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="black">1</text>

  <circle cx="218" cy="272" r="24" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="218" y="279" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="black">3</text>

  <circle cx="322" cy="272" r="24" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="322" y="279" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="black">6</text>

  <circle cx="462" cy="272" r="24" fill="white" stroke="black" stroke-width="2.5"/>
  <text x="462" y="279" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="black">10</text>
</svg>
